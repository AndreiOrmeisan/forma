name: Deploy FORMA frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Validate frontend
        run: npm run lint && npm run typecheck && npm test
        working-directory: frontend
      - name: Export frontend
        run: npm run build
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_PROJECT_STORAGE: ${{ vars.NEXT_PUBLIC_PROJECT_STORAGE || 'browser' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy frontend
        id: deployment
        uses: actions/deploy-pages@v5
